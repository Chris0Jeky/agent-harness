name: Prepare canary after transfer repair

on:
  push:
    branches: [chatgpt/prepare-canary-transfer-repair-pass4]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: e98520ac08d139f4765ad47339b4057b2a1bd9f3
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Repair four transcription errors and verify the original patch digest
        shell: python
        run: |
          import base64, gzip, hashlib, os, re
          from pathlib import Path
          source = Path('.github/workflows/prepare-bounded-fixes.yml').read_text('utf-8')
          match = re.search(r"'canary': \('([a-f0-9]{64})', '([^']+)'\)", source)
          assert match
          expected, encoded = match.groups()
          assert expected == '111074602788eeb274f2607cc8276b7a71e8abea00e10ddb652b300b2207c31f'
          for old, new in (
              ('O+TUfu7cNcSour', 'O+TUfuNcSour'),
              ('NjULi5qFv8wr', 'NjULi5qFf8wr'),
              ('htyX7ZCU', 'htyX7KCU'),
              ('6kc27e6qF3h/', '6kc27e6qFNh/'),
          ):
              assert encoded.count(old) == 1
              encoded = encoded.replace(old, new)
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == expected
          (Path(os.environ['RUNNER_TEMP']) / 'canary-verified.patch').write_bytes(patch)
          print(patch.decode(), flush=True)
          print('Original tested patch digest restored; no product code changed by repair.')
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ac10b2179ca2e078675085019f81204308e51cce
          persist-credentials: false
      - name: Apply the verified candidate only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ac10b2179ca2e078675085019f81204308e51cce
          git apply --check "$RUNNER_TEMP/canary-verified.patch"
          git apply "$RUNNER_TEMP/canary-verified.patch"
          git add scripts/learning_system.py tests/test_learning_system.py docs/CANARY_CHRONOLOGY.md
          test "$(git write-tree)" = 53d3ffd9c7c273b22615f16fb743543f4915c765
      - name: Install pinned development tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Check and normalize formatting without semantic changes
        shell: python
        run: |
          import ast, subprocess
          from pathlib import Path
          paths = ['scripts/learning_system.py', 'tests/test_learning_system.py']
          before = {p: ast.dump(ast.parse(Path(p).read_text('utf-8')), include_attributes=False) for p in paths}
          subprocess.run(['python','-m','black',*paths],check=True)
          assert before == {p: ast.dump(ast.parse(Path(p).read_text('utf-8')),include_attributes=False) for p in paths}
          print('FORMATTING_ONLY_DIFF',flush=True)
          subprocess.run(['git','diff'],check=True)
          subprocess.run(['git','add',*paths],check=True)
          subprocess.run(['python','-m','ruff','check',*paths],check=True)
          subprocess.run(['python','-m','black','--check',*paths],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
      - name: Run complete candidate validation
        shell: bash
        run: |
          set -euo pipefail
          unset TARGET
          python scripts/learning_bundle.py check
          python -m unittest discover -s tests -p 'test_*.py' -v
          python templates/hooks/smoke_test.py
          git diff --exit-code
      - name: Record Doctor limitations
        shell: bash
        run: |
          set +e
          python harness.py doctor
          code=$?
          echo "DOCTOR_EXIT=$code (hosted workspace, not native runtime qualification)"
          test "$code" -le 1
      - name: Store verified blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, subprocess
          from pathlib import Path
          paths = subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          assert set(paths) == {'scripts/learning_system.py','tests/test_learning_system.py','docs/CANARY_CHRONOLOGY.md'}
          files = []
          for path in paths:
              data = Path(path).read_bytes()
              expected = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              result = subprocess.run(['gh','api','--method','POST','repos/Chris0Jeky/agent-harness/git/blobs','--input','-'],input=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}),text=True,capture_output=True,check=True)
              assert json.loads(result.stdout)['sha'] == expected
              files.append({'path':path,'mode':'100644','type':'blob','sha':expected})
          tree = subprocess.check_output(['git','write-tree']).decode().strip()
          print('PREPARED_FIX='+json.dumps({'fix':'canary','tree':tree,'files':files},sort_keys=True),flush=True)
          print('No branch, pull request or main ref was updated by this workflow.')
