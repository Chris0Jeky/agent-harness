name: Prepare reviewed bundle diagnostic blobs
on:
  push:
    branches: [maintenance/prepare-bundle-278-1003]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install pinned development tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Construct and test reviewed candidate
        run: python .maintenance/prepare_bundle.py build
      - name: Store only verified blobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .maintenance/prepare_bundle.py publish
