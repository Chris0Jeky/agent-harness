name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Lint runs first so a slow runner cannot hide it; the Windows leg's tests
    # and smoke matrix took 13-18 minutes on 2026-09-29 (#402).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run Ruff
        run: python scripts/python_checks.py ruff

      - name: Check Black formatting
        run: python scripts/python_checks.py black

      - name: Compile Python sources
        run: python scripts/python_checks.py compile

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run replay tests on the supported host
        run: python -m unittest discover -s replay_v0/tests -v

      - name: Run deny-floor smoke matrix
        run: python templates/hooks/smoke_test.py


  replay-package:
    name: replay-package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install the package into a clean environment
        run: python -m pip install --disable-pip-version-check .
      - name: Replay the toy guard upgrade and expect the regression exit
        shell: bash
        run: |
          set +e
          charter-replay hooks             --baseline "python examples/toy-guard/guard_v1.py"             --candidate "python examples/toy-guard/guard_v2.py"             --corpus replay_v0/corpora/charter --output "$RUNNER_TEMP/toy"
          code=$?
          set -e
          test "$code" -eq 1
          # Exit 1 alone could be a crash; the summary proves the comparison ran.
          grep -q '"newly-allowed": 4' "$RUNNER_TEMP/toy"/summary.json

  replay-fast:
    name: replay-fast
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Run the dependency-free fast lane
        run: |
          python -m unittest discover -s replay_v0/tests/unit -v
          python -m unittest discover -s replay_v0/tests/contract -v

  replay-lint:
    name: replay-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install approved development tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run replay lint and formatting checks
        run: |
          python -m ruff check replay_v0
          python -m black --check --diff replay_v0

  replay-tests:
    name: replay-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Run all replay tests
        run: python -m unittest discover -s replay_v0/tests -v

  charter-digests:
    name: charter-digests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Validate charter bytes and records
        run: |
          python -m replay_v0.cli validate --corpus replay_v0/corpora/charter
          python -m unittest discover -s replay_v0/tests/charter -v

  recorded-baseline:
    name: recorded-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Validate the synthetic recorded baseline
        run: >-
          python -m unittest
          replay_v0.tests.charter.test_charter.CharterCorpusTests.test_synthetic_recording_matches_class_contract
          -v

  operations-contract:
    name: operations-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install approved development tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Prove the approved Pytest compatibility contract
        run: |
          python -m pytest -q replay_v0/tests/unit replay_v0/tests/contract
          python -m pytest -q replay_v0/tests
      - name: Prove determinism and extraction scope
        run: python -m unittest replay_v0.tests.test_determinism -v
      - name: Require the governing operations record
        run: >-
          python -c "from pathlib import Path;
          assert Path('AGENT_HARNESS_OPERATIONS.md').is_file()"
