name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run deny-floor smoke matrix
        run: python templates/hooks/smoke_test.py

      - name: Run Ruff
        run: >-
          python -m ruff check
          harness.py tests/test_harness.py
          templates/hooks/dispatch.py templates/hooks/smoke_test.py

      - name: Check Black formatting
        run: >-
          python -m black --check
          harness.py tests/test_harness.py
          templates/hooks/dispatch.py templates/hooks/smoke_test.py

      - name: Compile Python sources
        run: >-
          python -m py_compile
          harness.py tests/test_harness.py
          templates/hooks/dispatch.py templates/hooks/smoke_test.py
