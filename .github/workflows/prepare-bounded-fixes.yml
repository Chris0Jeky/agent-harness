name: Prepare bounded pass-four fixes

on:
  push:
    branches: [chatgpt/prepare-bounded-fixes-pass4]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        fix: [canary, recurrence]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ac10b2179ca2e078675085019f81204308e51cce
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Reconstruct the exact readable patch
        env:
          FIX: ${{ matrix.fix }}
        shell: python
        run: |
          import base64, gzip, hashlib, os, subprocess
          from pathlib import Path
          payloads = {
            'canary': ('111074602788eeb274f2607cc8276b7a71e8abea00e10ddb652b300b2207c31f', ''),
            'recurrence': ('79b7ae3cf863c1bea33c9e76c5eba94010989d79d94c884c65d0aaea09d05147', '')
          }
          expected, encoded = payloads[os.environ['FIX']]
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == expected
          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip() == 'ac10b2179ca2e078675085019f81204308e51cce'
          target = Path(os.environ['RUNNER_TEMP']) / 'verified.patch'
          target.write_bytes(patch)
          print(patch.decode(), flush=True)
          subprocess.run(['git','apply','--check',str(target)],check=True)
          subprocess.run(['git','apply',str(target)],check=True)
          subprocess.run(['git','add','-A'],check=True)
      - name: Install repository-pinned checks
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Normalize formatting without changing Python semantics
        shell: python
        run: |
          import ast, subprocess
          from pathlib import Path
          paths = subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          changed = [p for p in paths if p.endswith('.py')]
          before = {p: ast.dump(ast.parse(Path(p).read_text('utf-8')),include_attributes=False) for p in changed}
          subprocess.run(['python','-m','black',*changed],check=True)
          assert before == {p: ast.dump(ast.parse(Path(p).read_text('utf-8')),include_attributes=False) for p in changed}
          print('FORMATTING_ONLY_DIFF',flush=True)
          subprocess.run(['git','diff'],check=True)
          subprocess.run(['git','add',*changed],check=True)
          subprocess.run(['python','-m','ruff','check',*changed],check=True)
          subprocess.run(['python','-m','black','--check',*changed],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
      - name: Run complete candidate verification
        shell: bash
        run: |
          set -euo pipefail
          unset TARGET
          python scripts/learning_bundle.py check
          python -m unittest discover -s tests -p 'test_*.py' -v
          python templates/hooks/smoke_test.py
          git diff --exit-code
      - name: Record Doctor limitations
        shell: bash
        run: |
          set +e
          python harness.py doctor
          code=$?
          echo "DOCTOR_EXIT=$code (hosted workspace, not native runtime qualification)"
          test "$code" -le 1
      - name: Store verified blobs without publishing references
        env:
          GH_TOKEN: ${{ github.token }}
          FIX: ${{ matrix.fix }}
        shell: python
        run: |
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          paths = subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          allowed = {
            'canary': {'scripts/learning_system.py','tests/test_learning_system.py','docs/CANARY_CHRONOLOGY.md'},
            'recurrence': {'scripts/learning_metrics.py','tests/test_learning_metrics.py'},
          }
          assert set(paths) == allowed[os.environ['FIX']]
          files = []
          for path in paths:
              data = Path(path).read_bytes()
              expected = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              result = subprocess.run(['gh','api','--method','POST','repos/Chris0Jeky/agent-harness/git/blobs','--input','-'],input=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}),text=True,capture_output=True,check=True)
              assert json.loads(result.stdout)['sha'] == expected
              files.append({'path':path,'mode':'100644','type':'blob','sha':expected})
          tree = subprocess.check_output(['git','write-tree']).decode().strip()
          print('PREPARED_FIX='+json.dumps({'fix':os.environ['FIX'],'tree':tree,'files':files},sort_keys=True),flush=True)
          print('No branch, pull request or main ref was updated by this workflow.')
