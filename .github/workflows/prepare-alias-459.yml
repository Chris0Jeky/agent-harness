name: Prepare existing skill identity repair
on:
  push:
    branches: [prepare/alias-459-20261007]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      BASE: e251626096a59a2f65b319494b41f694f679e5c3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Prove regression and prepare only product files
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config user.name 'Repository maintenance'
          git config user.email 'noreply@openai.com'
          python - <<'PY'
          import ast, hashlib, json, os, pathlib, subprocess, sys
          base=os.environ['BASE']
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse',base+'^{tree}') == '8ac9d803b7d40c49beb0c2ed94b617404edfe5f0'
          payload=pathlib.Path('.github/preparation/alias.patch').read_bytes().replace(b'\r\n',b'\n')
          assert hashlib.sha256(payload).hexdigest() == 'be427c38aca0c2854ffc5c6c276c08c6af6f18dc8f99e03616092344a5c58dce'
          patch=pathlib.Path(os.environ['RUNNER_TEMP'],'alias.patch'); patch.write_bytes(payload)
          work=pathlib.Path(os.environ['RUNNER_TEMP'],'alias-product')
          subprocess.run(['git','worktree','add','--detach',str(work),base],check=True)
          os.chdir(work)
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply','--include=tests/test_skill_tree_mode_digest.py',str(patch)],check=True)
          red=subprocess.run([sys.executable,'-m','unittest','tests.test_skill_tree_mode_digest.ExistingSkillRootIdentityTests','-v'],capture_output=True,text=True)
          print(red.stdout,red.stderr,flush=True)
          assert red.returncode==1 and 'failures=6' in red.stderr and 'errors=' not in red.stderr
          subprocess.run(['git','apply','--include=harness.py',str(patch)],check=True)
          subprocess.run([sys.executable,'-m','pip','install','--disable-pip-version-check','-r','requirements-dev.txt'],check=True)
          files=['harness.py','tests/test_skill_tree_mode_digest.py']
          before={p:ast.dump(ast.parse(pathlib.Path(p).read_text())) for p in files}
          subprocess.run([sys.executable,'-m','black',*files],check=True)
          assert before=={p:ast.dump(ast.parse(pathlib.Path(p).read_text())) for p in files}
          for args in ([sys.executable,'-m','ruff','check',*files],[sys.executable,'-m','black','--check',*files],[sys.executable,'-m','unittest','tests.test_skill_tree_mode_digest','-v'],[sys.executable,'-m','unittest','discover','-s','tests','-p','test_bundle*.py','-q'],['git','diff','--check']): subprocess.run(args,check=True)
          assert set(git('diff','--name-only').splitlines())==set(files)
          subprocess.run(['git','add',*files],check=True)
          identity={'base':base,'tree':git('write-tree'),'files':{p:git('rev-parse',':'+p) for p in files}}
          print(json.dumps(identity,indent=2),flush=True)
          pathlib.Path(os.environ['RUNNER_TEMP'],'alias-identity.json').write_text(json.dumps(identity,indent=2))
          PY
      - name: Prove actual Linux bind-mount collision
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          git show "$BASE:harness.py" > "$RUNNER_TEMP/baseline_harness.py"
          sudo -n unshare --mount --propagation private "$(command -v python)" .github/preparation/native-bind.py "$RUNNER_TEMP/baseline_harness.py" "$RUNNER_TEMP/alias-product/harness.py"
      - name: Preserve verified product objects
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/alias-product"
          git commit -m 'Prepare existing skill target identity repair'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/prepared/alias-459-20261007
          cat "$RUNNER_TEMP/alias-identity.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alias-${{ matrix.os }}
          path: ${{ runner.temp }}/alias-identity.json
          retention-days: 7
