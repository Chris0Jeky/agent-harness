name: Verify seven pinned repairs
on:
  push:
    branches: [verify/seven-repairs-20261007]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      BASE: e251626096a59a2f65b319494b41f694f679e5c3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: e251626096a59a2f65b319494b41f694f679e5c3
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Merge only exact product heads in an isolated worktree
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config user.name 'Repository maintenance'
          git config user.email 'noreply@openai.com'
          test "$(git rev-parse "$BASE^{tree}")" = 8ac9d803b7d40c49beb0c2ed94b617404edfe5f0
          git worktree add --detach "$RUNNER_TEMP/seven-repairs" "$BASE"
          cd "$RUNNER_TEMP/seven-repairs"
          git switch -c integration-only
          for head in 95ebca43b5de8e63a7d5816fd23015f0516841f2 250e36713fa6980725a4eab7c737feb09d9dadd2 5832951d1c04f31ad8d0e0354d9f6eb9cb8898e0 501425ad6720f4396647fe48c4676b7c50977eea 26d827e4b09f7b13b7132eda470ba50f9baeae4c 5299da2777fc5f7bc23b784724b8d37c9b92e9ef dac7750c0ea175a7ad47f2c8e82e0271ef2a6138; do
            git merge --no-ff --no-edit "$head"
          done
          python - <<'PY'
          import json, os, pathlib, subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          paths={'README.md','harness.py','scripts/build_docs_site.py','tests/test_build_docs_site.py','tests/test_skill_tree_mode_digest.py','tests/test_managed_agent_atomic.py','replay_v0/importer.py','replay_v0/tests/unit/test_importer.py','replay_v0/README.md','replay_v0/cli.py','replay_v0/policy_sources.py','replay_v0/tests/contract/test_cli.py'}
          assert set(git('diff','--name-only',os.environ['BASE'],'HEAD').splitlines())==paths
          evidence=pathlib.Path(os.environ['RUNNER_TEMP'],'seven-evidence'); evidence.mkdir()
          identity={'base':os.environ['BASE'],'tree':git('rev-parse','HEAD^{tree}'),'files':{p:git('rev-parse','HEAD:'+p) for p in sorted(paths)}}
          (evidence/'identity.json').write_text(json.dumps(identity,indent=2))
          (evidence/'integration.patch').write_bytes(subprocess.check_output(['git','diff','--binary',os.environ['BASE'],'HEAD']))
          # Retain exact new product patches as well as the combined integration.
          for number,head in [(483,'5299da2777fc5f7bc23b784724b8d37c9b92e9ef'),(484,'dac7750c0ea175a7ad47f2c8e82e0271ef2a6138')]:
              (evidence/f'pr-{number}.patch').write_bytes(subprocess.check_output(['git','diff','--binary',os.environ['BASE'],head]))
          print(json.dumps(identity,indent=2))
          PY
          git diff --check "$BASE" HEAD
      - name: Verify changed modules, replay integration and bundle recovery
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/seven-repairs"
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python - <<'PY'
          import os, pathlib, subprocess, sys
          files=['harness.py','scripts/build_docs_site.py','tests/test_build_docs_site.py','tests/test_skill_tree_mode_digest.py','tests/test_managed_agent_atomic.py','replay_v0/importer.py','replay_v0/tests/unit/test_importer.py','replay_v0/cli.py','replay_v0/policy_sources.py','replay_v0/tests/contract/test_cli.py']
          checks=[('ruff',[sys.executable,'-m','ruff','check',*files]),('black',[sys.executable,'-m','black','--check',*files]),('modules',[sys.executable,'-m','unittest','tests.test_build_docs_site','tests.test_skill_tree_mode_digest','tests.test_managed_agent_atomic','-v']),('replay',[sys.executable,'-m','unittest','discover','-s','replay_v0/tests','-v']),('bundle',[sys.executable,'-m','unittest','discover','-s','tests','-p','test_bundle*.py','-v']),('docs',[sys.executable,'scripts/build_docs_site.py','--out','_site_src'])]
          evidence=pathlib.Path(os.environ['RUNNER_TEMP'],'seven-evidence')
          for name,argv in checks:
              result=subprocess.run(argv,capture_output=True,text=True,timeout=600)
              (evidence/(name+'.log')).write_text(result.stdout+result.stderr)
              print(name,'EXIT',result.returncode,flush=True)
              print(result.stdout,result.stderr,flush=True)
              if result.returncode: raise SystemExit(result.returncode)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: seven-repairs-${{ matrix.os }}
          path: ${{ runner.temp }}/seven-evidence/
          retention-days: 7
