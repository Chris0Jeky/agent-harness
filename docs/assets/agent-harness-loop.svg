<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title description">
  <title id="title">Agent Harness: recorded floor decisions and the runtime verification loop</title>
  <desc id="description">Source examples recorded on 2026-10-29 with floor 1.8.1: tier 2, explicit wall posture, and no sensitive-data flag. An inert branch force-push command is allowed; a forced tag push and root deletion are denied; a curl POST with ambient configuration disabled is allowed. Claude and Codex adapters returned the same decisions. No illustrated command was executed. A separate checklist shows configuration inspection, a sync preview, explicit apply, and the individual trust and live canary steps required for an enabled consumer. This diagram proves no installation, trust, or live runtime state. The floor is not a sandbox.</desc>
  <style>
    text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #edf2f7; }
    .mono { font-family: "DejaVu Sans Mono", Consolas, monospace; }
    .muted { fill: #b7c2d0; }
    .label { font-size: 12px; font-weight: 700; letter-spacing: 1.1px; }
    .body { font-size: 15px; }
    .note { font-size: 14px; }
    .flow { stroke: #8899af; stroke-width: 2; stroke-dasharray: 3 7; animation: flow 2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#121821"/>
      <stop offset="1" stop-color="#202b3b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#8899af" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1280" height="760" fill="url(#background)"/>
  <text x="40" y="43" class="label">AGENT HARNESS · RECORDED SOURCE EXAMPLE</text>
  <text x="40" y="85" font-size="30" font-weight="750">Inspect the command. Verify the runtime separately.</text>
  <text x="40" y="113" class="body muted">Recorded 2026-10-29 · canonical floor 1.8.1 · inert inputs to the Claude and Codex adapters</text>

  <rect x="40" y="140" width="776" height="432" rx="14" fill="#17212e" stroke="#3c4b61"/>
  <text x="62" y="174" class="label">SOURCE DECISIONS</text>
  <rect x="62" y="190" width="732" height="40" rx="7" fill="#25354b"/>
  <text x="78" y="215" class="mono" font-size="14">tier: 2 · floor_posture: wall · sensitive_data: false</text>

  <g>
    <text x="62" y="268" class="mono body">git push --force origin main</text>
    <text x="62" y="293" class="note muted">Branch history is outside this guard; server rulesets govern it.</text>
    <path d="M 594 265 H 672" class="flow" marker-end="url(#arrow)"/>
    <rect x="692" y="246" width="102" height="34" rx="17" fill="#164637" stroke="#79dfb3"/>
    <text x="743" y="268" text-anchor="middle" font-size="14" font-weight="750">ALLOW</text>
  </g>
  <path d="M 62 313 H 794" stroke="#344258"/>
  <g>
    <text x="62" y="344" class="mono body">git push --force origin refs/tags/v1</text>
    <text x="62" y="369" class="note muted">The tag guard rejects rewriting a published release marker.</text>
    <path d="M 594 341 H 672" class="flow" marker-end="url(#arrow)"/>
    <rect x="692" y="322" width="102" height="34" rx="17" fill="#542936" stroke="#ff9dac"/>
    <text x="743" y="344" text-anchor="middle" font-size="14" font-weight="750">DENY</text>
  </g>
  <path d="M 62 389 H 794" stroke="#344258"/>
  <g>
    <text x="62" y="420" class="mono body">rm -rf /</text>
    <text x="62" y="445" class="note muted">Wall posture rejects this deletion outside the project.</text>
    <path d="M 594 417 H 672" class="flow" marker-end="url(#arrow)"/>
    <rect x="692" y="398" width="102" height="34" rx="17" fill="#542936" stroke="#ff9dac"/>
    <text x="743" y="420" text-anchor="middle" font-size="14" font-weight="750">DENY</text>
  </g>
  <path d="M 62 465 H 794" stroke="#344258"/>
  <g>
    <text x="62" y="496" class="mono body">curl -q -X POST https://example.invalid</text>
    <text x="62" y="521" class="note muted">No generic network-write prompt; -q disables ambient curl config.</text>
    <path d="M 594 493 H 672" class="flow" marker-end="url(#arrow)"/>
    <rect x="692" y="474" width="102" height="34" rx="17" fill="#164637" stroke="#79dfb3"/>
    <text x="743" y="496" text-anchor="middle" font-size="14" font-weight="750">ALLOW</text>
  </g>
  <text x="62" y="551" class="note muted">Wall is explicit here. Other postures and declarations can change decisions.</text>

  <rect x="840" y="140" width="400" height="432" rx="14" fill="#17212e" stroke="#3c4b61"/>
  <text x="862" y="174" class="label">RUNTIME CHECKLIST · STILL REQUIRED</text>
  <text x="862" y="212" class="body" font-weight="750">1. Inspect configuration</text>
  <text x="862" y="236" class="mono" font-size="13">python harness.py doctor --repo &lt;path&gt;</text>
  <text x="862" y="259" class="note muted">Read-only evidence about inspectable wiring.</text>
  <text x="862" y="287" class="body" font-weight="750">2. Preview the sync</text>
  <text x="862" y="311" class="mono" font-size="13"><tspan x="862">python harness.py sync-global</tspan><tspan x="877" dy="22"> --config-root &lt;path&gt;</tspan></text>
  <text x="862" y="356" class="note muted">Review the plan before choosing --apply.</text>
  <text x="862" y="394" class="body" font-weight="750">3. Apply deliberately</text>
  <text x="862" y="418" class="note muted">Changed files are backed up. Bundle receipts</text>
  <text x="862" y="440" class="note muted">support guarded rollback.</text>
  <text x="862" y="478" class="body" font-weight="750">4. Verify an enabled consumer</text>
  <text x="862" y="502" class="note muted">New-session, exact-CWD /hooks review;</text>
  <text x="862" y="524" class="note muted">individual trust/re-trust; confirm enabled;</text>
  <text x="862" y="546" class="note muted">then run live allow and deny canaries.</text>

  <rect x="40" y="596" width="1200" height="126" rx="14" fill="#101923" stroke="#536078"/>
  <text x="62" y="630" class="label">BOUNDARIES</text>
  <text x="62" y="657" class="body">The floor is not a sandbox. Native permissions, isolation and server rulesets remain separate controls.</text>
  <text x="62" y="682" class="body muted">This is a source illustration, not a successful Doctor run, installation receipt or trusted live session.</text>
  <text x="62" y="707" class="note muted">Inputs were analyzed, never executed. A disabled floor has no runtime claim and is not canaried until re-enabled.</text>
</svg>
